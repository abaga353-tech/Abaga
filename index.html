<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                🤖 SmartAI
            </div>

            <button class="menu-btn" id="menuBtn">
                ☰
            </button>
        </header>


        <!-- Chat Area -->
        <main class="chat" id="chat">

            <!-- Welcome message -->
            <div class="welcome">
                <div class="robot">🤖</div>

                <h1>Hello! I'm SmartAI</h1>

                <p>
                    Your smart AI assistant. Ask me anything and
                    I'll do my best to help you.
                </p>
            </div>

        </main>


        <!-- Input Area -->
        <div class="input-area">

            <button class="attach-btn" id="attachBtn">
                ＋
            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Message SmartAI..."
                autocomplete="off"
            >

            <button class="send-btn" id="sendBtn">
                ➤
            </button>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
